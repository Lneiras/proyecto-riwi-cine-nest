name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run linter
        run: npx oxlint src/ test/ # 👈 CAMBIADO: Ejecuta oxlint directamente con npx para evitar el error usage

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile build
        run: npx nest build

      - name: Run Unit Tests
        run: npx vitest run

      - name: Run E2E Tests
        run: npx vitest run --config ./vitest.config.e2e.ts # 👈 CAMBIADO: Asegura también los tests E2E